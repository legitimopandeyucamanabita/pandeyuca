<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Secreto de Manabí - GPS Google Maps</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c0a16c 0%, #b39158 100%);
            --price-gold: #b5955b;
            --brand-yellow: #f2b705; 
            --font-fancy: 'Dancing Script', cursive;
            --paper-bg: #fdfbf2;
            --gold-frame: 5px solid var(--price-gold);
            --gold-shadow: 0 10px 20px rgba(181, 149, 91, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #d4d0c1;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .menu-paper {
            width: 100%;
            max-width: 1000px;
            background: var(--paper-bg) url('https://www.transparenttextures.com/patterns/aged-paper.png');
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            border: 1px solid #c4c1af;
            position: relative;
        }

        .branding-section { text-align: center; margin-bottom: 50px; }
        .main-logo {
            width: 160px; height: 160px; background: white;
            border-radius: 50%; border: 6px solid var(--brand-yellow);
            padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.5s; object-fit: cover;
        }

        .header h1 { 
            font-family: var(--font-fancy); color: #b39158; 
            font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; 
        }
        .header p { font-size: 1.2rem; color: #666; font-weight: 600; margin: 5px 0; }
        .section-title { font-size: 2.5rem; font-weight: 800; color: #333; margin: 30px 0; text-align: center; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            align-items: center;
        }

        .product-card {
            text-align: center;
            padding: 20px;
            border-radius: 20px;
            overflow: hidden;
        }

        .framed-img {
            width: 100%;
            max-width: 170px;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            border: var(--gold-frame);
            box-shadow: var(--gold-shadow);
        }

        .prod-info b { font-size: 1.4rem; color: #333; display: block; margin-top: 15px; }
        .prod-info span { font-size: 1rem; color: #777; font-weight: 700; }

        .price-tag {
            background: var(--price-gold);
            color: white; width: 85px; height: 85px; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center;
            margin: 15px auto; font-weight: 800;
        }
        .price-tag big { font-size: 1.5rem; }
        .price-tag small { font-size: 0.6rem; letter-spacing: 1px; }

        .promo-box {
            background: white; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 2px solid #eee; overflow: hidden;
            text-align: center;
        }
        .promo-header { background: var(--gold-gradient); color: white; padding: 20px; }
        .promo-header h4 { margin: 0; font-size: 1.1rem; letter-spacing: 2px; font-weight: 800; }
        .promo-header h2 { font-family: var(--font-fancy); font-size: 3.2rem; margin: 5px 0; }
        
        .promo-content { padding: 30px 20px; }
        .gift-container { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .gift-item img {
            width: 130px; height: 130px; border-radius: 12px; border: var(--gold-frame); box-shadow: var(--gold-shadow); object-fit: cover;
        }

        /* --- GPS SECTION GOOGLE MAPS --- */
        .gps-section { margin-top: 60px; border-top: 3px dashed rgba(181, 149, 91, 0.2); padding-top: 40px; text-align: center; }
        
        #map-container { 
            width: 100%; 
            height: 450px; 
            margin: 30px 0; 
            border-radius: 20px; 
            border: 6px solid white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden; 
            position: relative;
        }

        #googleMap { width: 100%; height: 100%; }

        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 15px 30px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.95rem; }
        .btn-wa { background: #2563eb; color: white; }
        .btn-gold { background: var(--price-gold); color: white; }

        #adminPanel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 25px; z-index: 10000;
            border: 5px solid var(--brand-yellow); display: none; text-align: center; width: 320px; box-shadow: 0 0 100px rgba(0,0,0,0.6);
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
            .promo-box { order: -1; margin-bottom: 30px; }
        }
    </style>
</head>
<body>

    <div class="menu-paper">
        <div class="branding-section">
            <img src="logo.png" alt="Logo" class="main-logo">
            <header class="header">
                <h1>Pan de Yuca Manabita</h1>
                <p>"Directamente del horno a tu paladar"</p>
            </header>
            <div class="section-title">Nuestros Precios</div>
        </div>

        <div class="content-grid">
            <div class="column">
                <div class="product-card">
                    <img src="funda.jpeg" class="framed-img">
                    <div class="price-tag"><big>$1.00</big></div>
                </div>
            </div>
            <div class="promo-box">
                <div class="promo-header"><h2>¡Llévate!</h2></div>
                <div class="promo-content">🎁 Regalo por 5 fundas</div>
                <div onclick="abrirAdmin()" style="height:30px; cursor:pointer;"></div>
            </div>
            <div class="column">
                <div class="product-card">
                    <img src="yogurt.jpeg" class="framed-img">
                    <div class="price-tag"><big>$0.75</big></div>
                </div>
            </div>
        </div>

        <div class="gps-section">
            <h2 style="font-family: var(--font-fancy); font-size: 3rem; color: #b39158; margin: 15px 0 0;">Sigue nuestra ruta en vivo 🚚</h2>
            
            <div id="map-container">
                <div id="googleMap"></div>
            </div>
            
            <div class="btn-group">
                <a href="https://wa.me/593984637626" class="btn btn-wa">🛍️ WhatsApp</a>
                <button class="btn btn-gold" onclick="centrarMapa()">🎯 Centrar</button>
            </div>
        </div>
    </div>

    <div id="adminPanel">
        <h3>Control de Ruta</h3>
        <button class="btn btn-wa" style="width:100%; margin-bottom:10px; background:#22c55e" onclick="iniciarRuta()">▶️ INICIAR RUTA</button>
        <button class="btn btn-wa" style="width:100%; background:#ef4444" onclick="detenerRuta()">⏹️ DETENER RUTA</button>
        <button class="btn btn-outline" style="width:100%; margin-top:20px;" onclick="document.getElementById('adminPanel').style.display='none'">Cerrar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVc_G_0LlsqqSaMGzucebnUnUqszOoZcs",
            authDomain: "pan-de-yuca.firebaseapp.com",
            databaseURL: "https://pan-de-yuca-default-rtdb.firebaseio.com",
            projectId: "pan-de-yuca",
            storageBucket: "pan-de-yuca.firebasestorage.app",
            messagingSenderId: "146026389755",
            appId: "1:146026389755:web:5148691db252f56215d05e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const rutaRef = db.ref('ubicacion_ruta');

        let map, marker;

        // INICIALIZAR GOOGLE MAPS
        function initMap() {
            const initialPos = { lat: 0, lng: 0 };
            map = new google.maps.Map(document.getElementById("googleMap"), {
                zoom: 18,
                center: initialPos,
                mapTypeId: 'roadmap',
                heading: 0,
                tilt: 45,
                disableDefaultUI: true, // Limpio para que parezca GPS
                gestureHandling: "greedy" // Permite rotar con 2 dedos
            });

            // Icono del camión (Emoji o imagen)
            marker = new google.maps.Marker({
                position: initialPos,
                map: map,
                icon: {
                    path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                    scale: 6,
                    fillColor: "#f2b705",
                    fillOpacity: 1,
                    strokeWeight: 2,
                    rotation: 0 // Aquí se aplicará el heading
                },
                title: "Estamos aquí"
            });
        }

        // Ejecutar initMap al cargar
        window.onload = initMap;

        function centrarMapa() {
            if(marker) map.setCenter(marker.getPosition());
        }

        // RECIBIR DATOS FIREBASE
        rutaRef.on('value', snap => {
            const d = snap.val();
            if(d && d.lat){
                const pos = { lat: d.lat, lng: d.lon };
                const rumbo = d.heading || 0;

                marker.setPosition(pos);
                
                // Rotar el marcador
                const icon = marker.getIcon();
                icon.rotation = rumbo;
                marker.setIcon(icon);

                // ROTACIÓN AUTOMÁTICA DEL MAPA (Modo GPS)
                if(d.estado === 'activo') {
                    map.setCenter(pos);
                    map.setHeading(rumbo); // Gira el mapa hacia donde vas
                }
            }
        });

        // ADMIN
        let watchId = null;
        function abrirAdmin() { if(prompt("Acceso Admin:") === "panyuca.2026") document.getElementById('adminPanel').style.display='block'; }
        
        function iniciarRuta() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    rutaRef.update({ 
                        lat: pos.coords.latitude, 
                        lon: pos.coords.longitude, 
                        estado: 'activo', 
                        heading: pos.coords.heading || 0
                    });
                }, null, { enableHighAccuracy: true });
            }
        }

        function detenerRuta() {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            rutaRef.update({ estado: 'cerrado' });
            alert("Ruta detenida.");
        }
    </script>
</body>
</html>
