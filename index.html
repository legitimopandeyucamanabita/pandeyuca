<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan de Yuca Manabita | La Ruta del Sabor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700;900&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Raruto/leaflet-rotate@master/dist/leaflet-rotate.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c0a16c 0%, #b39158 100%);
            --price-gold: #b5955b;
            --brand-yellow: #f2b705; 
            --font-fancy: 'Dancing Script', cursive;
            --paper-bg: #fdfbf2;
            --gold-frame: 5px solid var(--price-gold);
            --gold-shadow: 0 10px 20px rgba(181, 149, 91, 0.3);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background: #d4d0c1; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .menu-paper { width: 100%; max-width: 1000px; background: var(--paper-bg) url('https://www.transparenttextures.com/patterns/aged-paper.png'); padding: 50px 30px; border-radius: 15px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); border: 1px solid #c4c1af; position: relative; }
        .branding-section { text-align: center; margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; position: relative; }

        /* Ajuste de precisión para el logo y texto curvo */
        .hero-banner-container { position: relative; margin-top: 65px; margin-bottom: 30px; display: inline-block; width: 250px; height: 250px; }
        .hero-image { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; border: 1.5px solid var(--price-gold); box-shadow: 0 4px 15px rgba(181, 149, 91, 0.15); }
        .hero-text-overlay { position: absolute; top: -45px; left: -25px; width: 300px; height: 300px; pointer-events: none; overflow: visible; }
        .hero-text-overlay text { font-family: var(--font-fancy); font-weight: 900; font-size: 50px; fill: #b39158; letter-spacing: 5px; }

        .header h1 { font-family: var(--font-fancy); color: #b39158; font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; }
        .title-with-side-logos { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 30px 0; width: 100%; }
        .section-title { font-size: 2.5rem; font-weight: 800; color: #333; margin: 0; }
        .side-logo-badge { width: 95px; height: 95px; border-radius: 50%; border: 1.5px solid var(--price-gold); background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 5px; }
        .side-logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
        .content-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; align-items: center; }
        .product-card { text-align: center; padding: 20px; transition: all 0.4s ease; border-radius: 20px; }
        .framed-img { width: 100%; max-width: 170px; border-radius: 12px; border: var(--gold-frame); box-shadow: var(--gold-shadow); }
        .prod-info b { font-size: 1.4rem; color: #333; display: block; margin-top: 15px; }
        .price-tag { background: var(--price-gold); color: white; width: 85px; height: 85px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; margin: 15px auto; font-weight: 800; }
        .promo-box { background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 2px solid #eee; text-align: center; }
        .promo-header { background: var(--gold-gradient); color: white; padding: 20px; }
        .gps-section { margin-top: 60px; border-top: 3px dashed rgba(181, 149, 91, 0.2); padding-top: 40px; text-align: center; }
        #map-container { width: 100%; height: 450px; margin: 30px 0; border-radius: 20px; border: 6px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #mapa { width: 100%; height: 100%; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 15px 30px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-wa { background: #2563eb; color: white; }
        .btn-gold { background: var(--price-gold); color: white; }
        .btn-outline { background: white; border: 2px solid var(--price-gold); color: var(--price-gold); }
        #adminPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 25px; z-index: 10000; display: none; border: 5px solid var(--brand-yellow); }
    </style>
</head>
<body>

<div class="menu-paper">
    <div class="branding-section">
        <!-- LOGO Y ARCO CORREGIDO -->
        <div class="hero-banner-container">
            <img src="logo.png" alt="Logo Pan de Yuca Tradicional" class="hero-image">
            <svg class="hero-text-overlay" viewBox="0 0 300 300">
                <!-- El arco definido de 9 a 3 (50,150 a 250,150) permite que el texto se mantenga fuera del borde -->
                <path id="heroArcPath" d="M 50,150 A 100,100 0 0,1 250,150" fill="transparent" />
                <text>
                    <textPath href="#heroArcPath" startOffset="50%" text-anchor="middle">Legítimo</textPath>
                </text>
            </svg>
        </div>

        <header class="header"><h1>"Del horno a tu paladar"</h1></header>
        
        <div class="title-with-side-logos">
            <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
            <div class="section-title">Nuestros Precios</div>
            <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
        </div>
    </div>

    <div class="content-grid">
        <!-- Productos -->
        <div class="column">
            <div class="product-card">
                <img src="funda.jpeg" alt="Funda" class="framed-img">
                <div class="prod-info"><b>Funda de Pan</b><span>(4 unidades)</span></div>
                <div class="price-tag"><big>$1.00</big><small>USD</small></div>
            </div>
            <div class="product-card">
                <img src="combo1.jpeg" alt="Combo" class="framed-img">
                <div class="prod-info"><b>🔥 Combo 1</b><span>(4 Panes + Yogurt)</span></div>
                <div class="price-tag"><big>$1.50</big><small>USD</small></div>
            </div>
        </div>
        <!-- Promo -->
        <div class="promo-box">
            <div class="promo-header"><h4>🎁 PROMO ESPECIAL</h4><h2>¡Llévate!</h2></div>
        </div>
        <!-- Más productos -->
        <div class="column">
            <div class="product-card">
                <img src="yogurt.jpeg" alt="Yogurt" class="framed-img">
                <div class="prod-info"><b>Yogurt</b><span>Vaso</span></div>
                <div class="price-tag"><big>$0.75</big><small>USD</small></div>
            </div>
            <div class="product-card">
                <img src="combo2.jpeg" alt="Combo 2" class="framed-img">
                <div class="prod-info"><b>🔥 Combo 2</b><span>(6 Panes + Yogurt)</span></div>
                <div class="price-tag"><big>$2.00</big><small>USD</small></div>
            </div>
        </div>
    </div>

    <div class="gps-section">
        <div class="status-pill"><div id="dot" class="dot"></div><span id="estadoTxt">Cargando estado...</span></div>
        <div id="map-container"><div id="mapa"></div></div>
        <div class="btn-group">
            <a href="https://wa.me/593984637626" class="btn btn-wa">🛍️ Ordenar WhatsApp</a>
            <button class="btn btn-gold" onclick="centrarMapa()">🎯 Centrar Mapa</button>
            <button class="btn btn-outline" onclick="abrirGmaps()">🧭 Google Maps</button>
            <button class="btn btn-outline" onclick="darLike()">❤️ <span id="likes">0</span></button>
            <button class="btn btn-outline" onclick="compartir()">🔗 Compartir</button>
        </div>
    </div>
</div>

<div id="adminPanel">
    <h2 style="color:var(--price-gold)">Control de Ruta</h2>
    <button class="btn btn-wa" onclick="iniciarRuta()">▶️ INICIAR RUTA</button>
    <button class="btn btn-wa" style="background:#ef4444; margin-top:10px;" onclick="detenerRuta()">⏹️ DETENER RUTA</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyDVc_G_0LlsqqSaMGzucebnUnUqszOoZcs", databaseURL: "https://pan-de-yuca-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    function darLike() { db.ref('likes').transaction(v => (v || 0) + 1); }
    db.ref('likes').on('value', s => document.getElementById('likes').innerText = s.val() || 0);
    function compartir() { navigator.clipboard.writeText(window.location.href); alert("Enlace copiado."); }
    function abrirAdmin() { if(prompt("Pass:") === "panyuca.2026") document.getElementById('adminPanel').style.display='block'; }
    // ... Resto de la lógica del mapa ...
</script>
</body>
</html>
