<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Secreto de Manabí - GPS Estable</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: 'Open Sans', sans-serif; background: #d4d0c1; }
        .menu-paper { max-width: 1000px; margin: auto; background: #fdfbf2; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        /* Contenedor del mapa */
        #map-container { 
            width: 100%; 
            height: 450px; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 5px solid white;
            position: relative;
            z-index: 1;
        }
        #mapa { width: 100%; height: 100%; }

        /* Estilo del icono del camión */
        .truck-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
        }
        .truck-emoji {
            font-size: 40px;
            transition: transform 0.5s ease; /* Giro suave */
            display: inline-block;
        }

        .controls { text-align: center; margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; background: #b5955b; color: white; }
    </style>
</head>
<body>

<div class="menu-paper">
    <h2 style="text-align:center; color:#b5955b;">Sigue nuestro sabor en vivo 🚚</h2>
    
    <div id="map-container">
        <div id="mapa"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="centrarEnCamion()">🎯 Centrar en Camión</button>
        <button class="btn" style="background:#2563eb" onclick="abrirAdmin()">⚙️ Admin</button>
    </div>
</div>

<div id="adminPanel" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; pading:20px; z-index:100; border:2px solid gold; padding:20px; border-radius:10px; text-align:center;">
    <h3>Panel de Ruta</h3>
    <button class="btn" style="background:green" onclick="iniciarRuta()">▶️ Iniciar GPS</button>
    <button class="btn" style="background:red" onclick="detenerRuta()">⏹️ Detener</button>
    <button onclick="this.parentElement.style.display='none'">Cerrar</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDVc_G_0LlsqqSaMGzucebnUnUqszOoZcs",
        authDomain: "pan-de-yuca.firebaseapp.com",
        databaseURL: "https://pan-de-yuca-default-rtdb.firebaseio.com",
        projectId: "pan-de-yuca",
        storageBucket: "pan-de-yuca.firebasestorage.app",
        messagingSenderId: "146026389755",
        appId: "1:146026389755:web:5148691db252f56215d05e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const rutaRef = db.ref('ubicacion_ruta');

    // Inicializar mapa sin rotaciones raras de CSS para mantener estabilidad
    const map = L.map('mapa', { zoomControl: true }).setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // Marcador con ANCLAJE CENTRAL PERFECTO
    const truckIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="truck-wrapper"><div id="truck-img" class="truck-emoji">🚚</div></div>`,
        iconSize: [50, 50],
        iconAnchor: [25, 25] // Esto hace que el camión NO se mueva al hacer zoom
    });

    let marker = L.marker([0, 0], { icon: truckIcon }).addTo(map);

    function centrarEnCamion() {
        map.flyTo(marker.getLatLng(), 18);
    }

    // Escuchar Firebase
    rutaRef.on('value', snap => {
        const data = snap.val();
        if(!data) return;

        const pos = [data.lat, data.lon];
        const heading = data.heading || 0;

        // 1. Actualizar posición del marcador
        marker.setLatLng(pos);

        // 2. Rotar SOLO el emoji (no el mapa) para mantener estabilidad táctil
        const truckImg = document.getElementById('truck-img');
        if(truckImg) {
            // El emoji de camión 🚚 apunta a la derecha, sumamos 90 si es necesario
            truckImg.style.transform = `rotate(${heading}deg)`;
        }

        // 3. Seguimiento suave si está activo
        if(data.estado === 'activo' && map.getCenter().lat === 0) {
            map.setView(pos, 17);
        }
    });

    // --- LÓGICA DE ADMIN (EL CAMIÓN) ---
    let watchId = null;
    function abrirAdmin() { if(prompt("Pass:") === "panyuca.2026") document.getElementById('adminPanel').style.display='block'; }

    function iniciarRuta() {
        if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(p => {
                rutaRef.update({
                    lat: p.coords.latitude,
                    lon: p.coords.longitude,
                    heading: p.coords.heading || 0,
                    estado: 'activo',
                    lastUpdate: Date.now()
                });
            }, null, { enableHighAccuracy: true, maximumAge: 0 });
            alert("Transmitiendo ubicación exacta...");
        }
    }

    function detenerRuta() {
        if(watchId) navigator.geolocation.clearWatch(watchId);
        rutaRef.update({ estado: 'cerrado' });
        alert("Ruta terminada.");
    }
</script>
</body>
</html>
