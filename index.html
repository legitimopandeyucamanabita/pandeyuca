<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan de Yuca Manabita | La Ruta del Sabor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700;900&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Raruto/leaflet-rotate@master/dist/leaflet-rotate.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c0a16c 0%, #b39158 100%);
            --price-gold: #b5955b;
            --font-fancy: 'Dancing Script', cursive;
            --paper-bg: #fdfbf2;
            --gold-frame: 5px solid var(--price-gold);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #d4d0c1;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .menu-paper {
            width: 100%;
            max-width: 1000px;
            background: var(--paper-bg) url('https://www.transparenttextures.com/patterns/aged-paper.png');
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            border: 1px solid #c4c1af;
            position: relative;
        }

        .branding-section { 
            text-align: center; 
            margin-bottom: 50px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- LOGO Y TEXTO CURVO --- */
        .hero-banner-container {
            position: relative;
            margin-top: 60px; 
            margin-bottom: 30px;
            width: 250px;  
            height: 250px; 
        }
        
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            border-radius: 50%; 
            border: 1.5px solid var(--price-gold);
        }

        .hero-text-overlay {
            position: absolute;
            top: -55px; 
            left: 0;
            width: 250px;
            height: 250px;
            pointer-events: none;
            overflow: visible;
        }
        .hero-text-overlay text {
            font-family: var(--font-fancy);
            font-weight: 900; 
            font-size: 55px; 
            fill: #b39158; 
            letter-spacing: 4px;
        }

        .header h1 { 
            font-family: var(--font-fancy); 
            color: #b39158; 
            font-size: clamp(2.5rem, 6vw, 4rem); 
            margin: 0; 
        }
        
        .title-with-side-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .section-title { font-size: 2.5rem; font-weight: 800; color: #333; }

        .side-logo-badge {
            width: 95px; height: 95px; border-radius: 50%; border: 1.5px solid var(--price-gold);
            background: #fff; display: flex; align-items: center; justify-content: center; padding: 5px;
        }
        .side-logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }

        /* --- PRODUCTOS --- */
        .content-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; align-items: center; }
        .product-card { text-align: center; padding: 20px; transition: 0.4s; }
        .product-card:hover { transform: translateY(-10px); }
        .framed-img { width: 100%; max-width: 170px; border-radius: 12px; border: var(--gold-frame); }
        .prod-info b { font-size: 1.4rem; color: #333; display: block; margin-top: 15px; }
        .price-tag { background: var(--price-gold); color: white; width: 85px; height: 85px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; margin: 15px auto; font-weight: 800; }

        /* --- PROMO --- */
        .promo-box { background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 2px solid #eee; text-align: center; }
        .promo-header { background: var(--gold-gradient); color: white; padding: 20px; }
        .promo-content { padding: 30px 20px; }
        .gift-item img { width: 130px; height: 130px; border-radius: 12px; border: var(--gold-frame); }

        /* --- GPS --- */
        .gps-section { margin-top: 60px; border-top: 3px dashed rgba(181, 149, 91, 0.2); padding-top: 40px; text-align: center; }
        #map-container { width: 100%; height: 450px; margin: 30px 0; border-radius: 20px; border: 6px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 25px; background: white; border-radius: 50px; font-weight: 800; border: 1px solid #eee; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: #EF4444; }

        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 15px 30px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-decoration: none; }
        .btn-wa { background: #2563eb; color: white; }
        .btn-gold { background: var(--price-gold); color: white; }
        .btn-outline { background: white; border: 2px solid var(--price-gold); color: var(--price-gold); }

        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="menu-paper">
        <div class="branding-section">
            <div class="hero-banner-container">
                <img src="logo.png" alt="Logo Pan de Yuca" class="hero-image">
                <svg class="hero-text-overlay" viewBox="0 0 250 250">
                    <!-- Arco de 9 a 3 (180 grados) -->
                    <path id="heroArcPath" d="M 25,125 A 100,100 0 0,1 225,125" fill="transparent" />
                    <text><textPath href="#heroArcPath" startOffset="50%" text-anchor="middle">Legítimo</textPath></text>
                </svg>
            </div>

            <header class="header">
                <h1>"Del horno a tu paladar"</h1>
            </header>
            
            <div class="title-with-side-logos">
                <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
                <div class="section-title">Nuestros Precios</div>
                <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
            </div>
        </div>

        <div class="content-grid">
            <div class="column">
                <div class="product-card">
                    <img src="funda.jpeg" class="framed-img">
                    <div class="prod-info"><b>Funda de Pan</b></div>
                    <div class="price-tag">$1.00</div>
                </div>
            </div>
            <div class="promo-box">
                <div class="promo-header"><h2>¡Llévate!</h2></div>
                <div class="promo-content"><p>Por la compra de 5 fundas</p></div>
            </div>
            <div class="column">
                <div class="product-card">
                    <img src="yogurt.jpeg" class="framed-img">
                    <div class="prod-info"><b>Yogurt</b></div>
                    <div class="price-tag">$0.75</div>
                </div>
            </div>
        </div>

        <div class="gps-section">
            <div class="status-pill"><div id="dot" class="dot"></div><span id="estadoTxt">Cargando...</span></div>
            <div id="map-container"><div id="mapa" style="width:100%; height:100%;"></div></div>
            <div class="btn-group">
                <a href="https://wa.me/593984637626" class="btn btn-wa">Ordenar WhatsApp</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        // Logica simplificada y limpia
        const firebaseConfig = { databaseURL: "https://pan-de-yuca-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const rutaRef = firebase.database().ref('ubicacion_ruta');

        const map = L.map('mapa').setView([0, 0], 18);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker = L.marker([0, 0]).addTo(map);

        rutaRef.on('value', snap => {
            const d = snap.val();
            if(d && d.lat) {
                marker.setLatLng([d.lat, d.lon]);
                document.getElementById('dot').style.background = d.estado === 'activo' ? "#22C55E" : "#EF4444";
                document.getElementById('estadoTxt').innerText = d.estado === 'activo' ? "Ruta Activa" : "Ruta Cerrada";
            }
        });
    </script>
</body>
</html>
