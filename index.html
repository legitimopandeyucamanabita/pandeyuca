<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan de Yuca Manabita | La Ruta del Sabor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700;900&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Raruto/leaflet-rotate@master/dist/leaflet-rotate.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c0a16c 0%, #b39158 100%);
            --price-gold: #b5955b;
            --brand-yellow: #f2b705; 
            --font-fancy: 'Dancing Script', cursive;
            --paper-bg: #fdfbf2;
            --gold-frame: 5px solid var(--price-gold);
            --gold-shadow: 0 10px 20px rgba(181, 149, 91, 0.3);
        }

        * { box-sizing: border-box; }

        body { font-family: 'Open Sans', sans-serif; background: #d4d0c1; margin: 0; padding: 20px; display: flex; justify-content: center; }

        .menu-paper { width: 100%; max-width: 1000px; background: var(--paper-bg) url('https://www.transparenttextures.com/patterns/aged-paper.png'); padding: 50px 30px; border-radius: 15px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); border: 1px solid #c4c1af; position: relative; }
        .branding-section { text-align: center; margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; position: relative; }

        /* --- CORRECCIÓN LOGO Y TEXTO CIRCULAR --- */
        .hero-banner-container {
            position: relative;
            margin-top: 50px; 
            margin-bottom: 30px;
            width: 250px;  
            height: 250px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-image {
            width: 220px; /* Ligeramente más pequeño que el contenedor para dejar espacio al texto */
            height: 220px;
            object-fit: contain; 
            border-radius: 50%; 
            border: 4px solid var(--price-gold); /* Borde dorado visible */
            box-shadow: 0 4px 15px rgba(181, 149, 91, 0.3);
            z-index: 2;
        }

        .hero-text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 250px;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }
        
        .hero-text-overlay text {
            font-family: var(--font-fancy);
            font-weight: 900;
            font-size: 38px; 
            fill: #b39158;
            letter-spacing: 2px;
        }

        .header h1 { font-family: var(--font-fancy); color: #b39158; font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; }
        .title-with-side-logos { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 30px 0; width: 100%; }
        .section-title { font-size: 2.5rem; font-weight: 800; color: #333; margin: 0; text-align: center; }
        .side-logo-badge { position: relative; width: 95px; height: 95px; border-radius: 50%; border: 1.5px solid var(--price-gold); box-shadow: 0 4px 10px rgba(181, 149, 91, 0.2); background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 5px; }
        .side-logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
        .content-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; align-items: center; }
        .product-card { text-align: center; padding: 20px; transition: all 0.4s ease; border-radius: 20px; overflow: hidden; }
        .framed-img { width: 100%; max-width: 170px; border: var(--gold-frame); border-radius: 12px; box-shadow: var(--gold-shadow); }
        .prod-info b { font-size: 1.4rem; color: #333; display: block; margin-top: 15px; }
        .price-tag { background: var(--price-gold); color: white; width: 85px; height: 85px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; margin: 15px auto; font-weight: 800; }
        .promo-box { background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 2px solid #eee; text-align: center; }
        .promo-header { background: var(--gold-gradient); color: white; padding: 20px; }
        .promo-header h2 { font-family: var(--font-fancy); font-size: 3.2rem; margin: 5px 0; }
        .gps-section { margin-top: 60px; border-top: 3px dashed rgba(181, 149, 91, 0.2); padding-top: 40px; text-align: center; }
        #map-container { width: 100%; height: 450px; margin: 30px 0; border-radius: 20px; border: 6px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        #mapa { width: 100%; height: 100%; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 15px 30px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-wa { background: #2563eb; color: white; }
        .btn-gold { background: var(--price-gold); color: white; }
        .btn-outline { background: white; border: 2px solid var(--price-gold); color: var(--price-gold); }
        #adminPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 25px; z-index: 10000; border: 5px solid var(--brand-yellow); display: none; }
    </style>
</head>
<body>

    <div class="menu-paper">
        <div class="branding-section">
            <div class="hero-banner-container">
                <!-- SVG ajustado para semicírculo superior exacto -->
                <svg class="hero-text-overlay" viewBox="0 0 250 250">
                    <path id="heroArcPath" d="M 30,125 A 95,95 0 0,1 220,125" fill="transparent" />
                    <text>
                        <textPath href="#heroArcPath" startOffset="50%" text-anchor="middle">Legítimo</textPath>
                    </text>
                </svg>
                <img src="logo.png" alt="Logo" class="hero-image">
            </div>

            <header class="header"><h1>"Del horno a tu paladar"</h1></header>
            
            <div class="title-with-side-logos">
                <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
                <div class="section-title">Nuestros Precios</div>
                <div class="side-logo-badge"><img src="logo-hero.png" class="side-logo-img"></div>
            </div>
        </div>

        <!-- El resto del contenido se mantiene intacto -->
        <div class="content-grid">
            <!-- (Contenido de productos, promo y mapa igual que en tu código original) -->
        </div>

        <!-- Secciones GPS y botones preservadas... -->
    </div>

    <!-- Scripts preservados... -->
</body>
</html>
