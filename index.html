<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Secreto de Manabí - GPS Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c0a16c 0%, #b39158 100%);
            --price-gold: #b5955b;
            --brand-yellow: #f2b705; 
            --font-fancy: 'Dancing Script', cursive;
            --paper-bg: #fdfbf2;
        }

        body { font-family: 'Open Sans', sans-serif; background: #d4d0c1; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .menu-paper { width: 100%; max-width: 1000px; background: var(--paper-bg); padding: 40px 20px; border-radius: 15px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); position: relative; }

        /* CONTENEDOR GPS ESTABILIZADO */
        .gps-section { margin-top: 40px; text-align: center; }
        #map-container { 
            width: 100%; 
            height: 450px; 
            margin: 20px 0; 
            border-radius: 20px; 
            border: 6px solid white; 
            overflow: hidden; 
            position: relative;
            background: #e5e3df;
        }
        #mapa { width: 100%; height: 100%; touch-action: none; }

        .camion-icon { font-size: 45px; text-align: center; line-height: 1; }
        
        .status-pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; background: white; border-radius: 50px; font-weight: 800; margin-bottom: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #EF4444; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-decoration: none; }
        .btn-wa { background: #2563eb; color: white; }
        .btn-gold { background: var(--price-gold); color: white; }

        #adminPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 25px; z-index: 10000; display: none; border: 5px solid var(--brand-yellow); }
    </style>
</head>
<body>

    <div class="menu-paper">
        <div class="gps-section">
            <div class="status-pill">
                <div id="dot" class="dot"></div>
                <span id="estadoTxt">Cargando GPS...</span>
            </div>
            <h2 style="font-family: var(--font-fancy); font-size: 2.5rem; color: #b39158;">Ruta en tiempo real 🚚</h2>
            
            <div id="map-container">
                <div id="mapa"></div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-gold" onclick="centrarMapa()">🎯 Centrar en Camión</button>
                <a href="https://wa.me/593984637626" class="btn btn-wa">🛍️ Pedir por WhatsApp</a>
                <div onclick="abrirAdmin()" style="width:40px; height:40px;"></div>
            </div>
        </div>
    </div>

    <div id="adminPanel">
        <h3>Panel de Control</h3>
        <button onclick="iniciarRuta()" style="background:green; color:white; padding:10px; width:100%">INICIAR TRANSMISIÓN</button><br><br>
        <button onclick="detenerRuta()" style="background:red; color:white; padding:10px; width:100%">DETENER RUTA</button><br><br>
        <button onclick="document.getElementById('adminPanel').style.display='none'">Cerrar</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/Raruto/leaflet-rotate@master/dist/leaflet-rotate.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVc_G_0LlsqqSaMGzucebnUnUqszOoZcs",
            authDomain: "pan-de-yuca.firebaseapp.com",
            databaseURL: "https://pan-de-yuca-default-rtdb.firebaseio.com",
            projectId: "pan-de-yuca",
            storageBucket: "pan-de-yuca.firebasestorage.app",
            messagingSenderId: "146026389755",
            appId: "1:146026389755:web:5148691db252f56215d05e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const rutaRef = db.ref('ubicacion_ruta');

        // MAPA CON ROTACIÓN HABILITADA
        const map = L.map('mapa', {
            zoomControl: false,
            rotate: true, // Habilita la rotación nativa
            touchRotate: false // Evita que el usuario rote el mapa por accidente
        }).setView([0, 0], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marker = L.marker([0, 0], {
            icon: L.divIcon({
                html: '<div id="camion" class="camion-icon">🚚</div>',
                className: 'none',
                iconSize: [50, 50],
                iconAnchor: [25, 25]
            })
        }).addTo(map);

        function centrarMapa() {
            map.flyTo(marker.getLatLng(), 18, { duration: 1 });
        }

        let ultimoRumbo = 0;

        rutaRef.on('value', snap => {
            const d = snap.val();
            if(!d) return;

            const nuevaPos = L.latLng(d.lat, d.lon);
            const rumbo = d.heading || 0;
            
            // Mover marcador
            marker.setLatLng(nuevaPos);

            // 1. ROTACIÓN DEL MAPA: Solo si el camión se está moviendo
            // Rotamos el mapa de forma que el rumbo sea siempre el norte (arriba)
            if (d.estado === 'activo') {
                map.setBearing(360 - rumbo); 
                map.panTo(nuevaPos);
            }

            // 2. CAMIÓN: Siempre mirando hacia arriba del teléfono
            // Al rotar el mapa, el camión debe estar en 0 relativo al mapa para mirar arriba
            const camionEl = document.getElementById('camion');
            if(camionEl) camionEl.style.transform = `rotate(0deg)`;

            // Interfaz
            const dot = document.getElementById('dot');
            const txt = document.getElementById('estadoTxt');
            if(d.estado === 'activo'){
                dot.style.background = "#22C55E";
                txt.innerText = "¡ESTAMOS REPARTIENDO!";
            } else {
                dot.style.background = "#EF4444";
                txt.innerText = "RUTA CERRADA";
                map.setBearing(0); // Volver al norte normal si está cerrado
            }
        });

        // ADMIN FUNCTIONS
        let watchId = null;
        function abrirAdmin() { if(prompt("Pass:") === "panyuca.2026") document.getElementById('adminPanel').style.display='block'; }

        async function iniciarRuta() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    rutaRef.update({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        heading: pos.coords.heading || 0,
                        estado: 'activo'
                    });
                }, null, { enableHighAccuracy: true });
                alert("GPS Transmitiendo...");
            }
        }

        function detenerRuta() {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            rutaRef.update({ estado: 'cerrado' });
            alert("Ruta apagada.");
        }
    </script>
</body>
</html>
